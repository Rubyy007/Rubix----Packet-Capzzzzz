[package]
name = "rubix"
version = "1.0.0"
edition = "2021"
authors = ["RUBIX -Manik"]
description = "Enterprise-Grade Network Defense Engine with Process Attribution"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rubix/rubix"
rust-version = "1.70"

[[bin]]
name = "rubix"
path = "src/main.rs"

[[bin]]
name = "rubix-cli"
path = "cli/main.rs"

[lib]
name = "rubix"
path = "src/lib.rs"
# rustc-hash = "1.1"  ← REMOVED: was incorrectly placed here; belongs in [dependencies]

[dependencies]
# ── Packet capture & parsing ──────────────────────────────────────────────────
pcap        = "1.3"
etherparse  = "0.15"

# ── Async runtime ─────────────────────────────────────────────────────────────
tokio = { version = "1.38", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "signal",
    "sync",
    "io-util",
    "net",
    "fs",
] }
async-trait = "0.1"
futures     = "0.3"

# ── Concurrency & caching ─────────────────────────────────────────────────────
crossbeam-channel = "0.5"
dashmap           = "6.0"
once_cell         = "1.19"
parking_lot       = "0.12"

# ── Fast integer-keyed hash map (proc_stats, u32 PIDs) ────────────────────────
# FxHashMap is 2-3× faster than SipHash for u32 keys.  proc_stats is
# packet-loop-private so HashDoS resistance is not required.
rustc-hash = "1.1"

# ── Serialization ─────────────────────────────────────────────────────────────
serde      = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"

# ── Logging & tracing ─────────────────────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender   = "0.2"

# ── Error handling ────────────────────────────────────────────────────────────
anyhow    = "1.0"
thiserror = "1.0"

# ── Time handling ─────────────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }

# ── Filesystem & config ───────────────────────────────────────────────────────
notify  = "6.1"
walkdir = "2"

# ── CLI ───────────────────────────────────────────────────────────────────────
clap      = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.27", features = ["event-stream"] }

# ── Network utilities ─────────────────────────────────────────────────────────
ipnet     = "2.12"
ipnetwork = "0.20"

# ── Terminal utilities ────────────────────────────────────────────────────────
atty = "0.2.14"

# ── HTTP client (webhook feature) ─────────────────────────────────────────────
reqwest = { version = "0.12", features = ["json", "rustls-tls"], optional = true }

# ── Database (storage feature) ────────────────────────────────────────────────
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

# ── Metrics (metrics feature) ─────────────────────────────────────────────────
metrics                     = { version = "0.23", optional = true }
metrics-exporter-prometheus = { version = "0.15", optional = true }

# ══════════════════════════════════════════════════════════════════════════════
# ── Linux-specific dependencies ───────────────────────────────────────────────
# ══════════════════════════════════════════════════════════════════════════════
[target.'cfg(target_os = "linux")'.dependencies]
nix    = { version = "0.29", features = ["socket", "net", "process", "user"] }
libc   = "0.2"
procfs = "0.16"

# ══════════════════════════════════════════════════════════════════════════════
# ── Windows-specific dependencies ─────────────────────────────════════════════
# ══════════════════════════════════════════════════════════════════════════════
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_System_Console",
] }

# ══════════════════════════════════════════════════════════════════════════════
# ── Feature flags ─────────────────────────────────────────────────────────────
# ══════════════════════════════════════════════════════════════════════════════
[features]
default = []
webhook = ["dep:reqwest"]
storage = ["dep:rusqlite"]
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus"]
full    = ["webhook", "storage", "metrics"]

# ══════════════════════════════════════════════════════════════════════════════
# ── Build profiles ────────────────────────────────────────────────────────────
# ══════════════════════════════════════════════════════════════════════════════

[profile.release]
opt-level       = 3
lto             = "fat"
codegen-units   = 1
strip           = true
panic           = "abort"
overflow-checks = true      # FIX #1: wrapping adds panic in release; hot path uses saturating_add()

[profile.dev]
opt-level   = 0
debug       = true
incremental = true

[profile.bench]
inherits      = "release"
lto           = "fat"
codegen-units = 1
opt-level     = 3

# ── Optimise hot dependencies even in dev builds ──────────────────────────────
[profile.dev.package.pcap]
opt-level = 2

[profile.dev.package.etherparse]
opt-level = 2

[profile.release.package."*"]
opt-level     = 3
codegen-units = 1

# ══════════════════════════════════════════════════════════════════════════════
# ── Package metadata ──────────────────────────────────────════════════════════
# ══════════════════════════════════════════════════════════════════════════════
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]