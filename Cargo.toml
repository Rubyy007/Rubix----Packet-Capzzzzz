[package]
name         = "rubix"
version      = "1.0.0"
edition      = "2021"
authors      = ["RUBIX - Manik"]
description  = "Enterprise-Grade Network Defense Engine with Process Attribution"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/rubix/rubix"
rust-version = "1.70"

[[bin]]
name = "rubix"
path = "src/main.rs"

[[bin]]
name = "rubix-cli"
path = "cli/main.rs"

[lib]
name = "rubix"
path = "src/lib.rs"

# ══════════════════════════════════════════════════════════════════════════════
# ── Dependencies ──────────────────────────────────────────────────────────────
# ══════════════════════════════════════════════════════════════════════════════

[dependencies]

# ── Packet capture & parsing ──────────────────────────────────────────────────
pcap       = "1.3"
etherparse = "0.15"

# ── Async runtime ─────────────────────────────────────────────────────────────
tokio = { version = "1.38", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "signal",
    "sync",
    "io-util",
    "net",
    "fs",
]}
async-trait = "0.1"
futures     = "0.3"

# ── Concurrency & caching ─────────────────────────────────────────────────────
crossbeam-channel = "0.5"
dashmap           = "6.1"
once_cell         = "1.19"
parking_lot       = "0.12"

# ── Fast hashing ──────────────────────────────────────────────────────────────
rustc-hash = "1.1"

# ── Serialization ─────────────────────────────────────────────────────────────
serde      = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"

# ── Logging & tracing ─────────────────────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender   = "0.2"

# ── Error handling ────────────────────────────────────────────────────────────
anyhow    = "1.0"
thiserror = "1.0"

# ── Time ──────────────────────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }

# ── Filesystem & hot-reload ───────────────────────────────────────────────────
notify  = "6.1"
walkdir = "2"

# ── CLI ───────────────────────────────────────────────────────────────────────
clap      = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.27", features = ["event-stream"] }

# ── Network utilities ─────────────────────────────────────────────────────────
ipnet     = "2.12"
ipnetwork = "0.20"

# ── Terminal utilities ────────────────────────────────────────────────────────
atty = "0.2.14"

# ── Process blocking ──────────────────────────────────────────────────────────
# sha2: SHA-256 fingerprinting for hash-based exe blocking (lazy, zero-cost
#       when no hash blocks are registered).
# hex:  encode/decode digests for CLI wire format and logging.
sha2 = "0.10"
hex  = "0.4"

# ── Optional features ─────────────────────────────────────────────────────────
reqwest  = { version = "0.12", features = ["json", "rustls-tls"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"],            optional = true }
metrics                     = { version = "0.23", optional = true }
metrics-exporter-prometheus = { version = "0.15", optional = true }
async-channel = "2.3"

# ══════════════════════════════════════════════════════════════════════════════
# ── Linux-specific dependencies ───────────────────────────────────────────────
# ══════════════════════════════════════════════════════════════════════════════

[target.'cfg(target_os = "linux")'.dependencies]
nix    = { version = "0.29", features = ["socket", "net", "process", "user"] }
libc   = "0.2"
# procfs: /proc/net/{tcp,udp,tcp6,udp6} → inode → PID (resolver/linux.rs).
# Also used by ProcessBlocklist::find_pids_for_exe / find_pids_for_hash.
procfs = "0.16"

# ══════════════════════════════════════════════════════════════════════════════
# ── Windows-specific dependencies ─────────────────────────────────────────────
# ══════════════════════════════════════════════════════════════════════════════

[target.'cfg(target_os = "windows")'.dependencies]

# `windows` crate — high-level safe bindings used by:
#   resolver/windows.rs : GetExtendedTcpTable / GetExtendedUdpTable /
#                         K32GetProcessImageFileNameW
#   blocker/windows.rs  : WFP direct API (FwpmEngineOpen0, FwpmFilterAdd0, …)
#
# Feature notes:
#   Win32_Security     — required for FWPM_SESSION0 / FWPM_FILTER0 structs
#   Win32_System_Rpc   — required for FwpmEngineOpen0 (RPC auth constants);
#                        without this feature the function is configured out
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_Rpc",
    "Win32_System_Threading",
]}

# `windows-sys` crate — low-level raw bindings used ONLY by:
#   blocker/process.rs : ToolHelp32 enumeration (find_pids_for_exe /
#                        find_pids_for_hash), OpenProcess,
#                        QueryFullProcessImageNameW, GetExitCodeProcess
#
# NOT used for WFP — all WFP calls go through the `windows` crate above.
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
]}

# ══════════════════════════════════════════════════════════════════════════════
# ── Feature flags ─────────────────────────────────────────────────────────────
# ══════════════════════════════════════════════════════════════════════════════

[features]
default = []
webhook = ["dep:reqwest"]
storage = ["dep:rusqlite"]
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus"]
full    = ["webhook", "storage", "metrics"]

# ══════════════════════════════════════════════════════════════════════════════
# ── Build profiles ────────────────────────────────────────════════════════════
# ══════════════════════════════════════════════════════════════════════════════

[profile.release]
opt-level       = 3
lto             = "fat"
codegen-units   = 1
strip           = true
panic           = "abort"
# overflow-checks: wrapping arithmetic panics in release; all hot-path
# counters use saturating_add() so this only catches genuine logic errors.
overflow-checks = true

[profile.dev]
opt-level   = 0
debug       = true
incremental = true

[profile.bench]
inherits      = "release"
lto           = "fat"
codegen-units = 1
opt-level     = 3

# Optimise hot capture/parse deps in dev so packet-loop profiling is realistic.
[profile.dev.package.pcap]
opt-level = 2

[profile.dev.package.etherparse]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 2

[profile.release.package."*"]
opt-level     = 3
codegen-units = 1

# ══════════════════════════════════════════════════════════════════════════════
# ── Package metadata ──────────────────────────────────────────────────────────
# ══════════════════════════════════════════════════════════════════════════════

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
